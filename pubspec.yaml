name: john_foods
description: John Foods - zero-cost food delivery app (Flutter + Firebase Spark).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FF5722"
  adaptive_icon_foreground: "assets/icon/icon_foreground_1024.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome_1024.png"
  web:
    generate: true
    image_path: "assets/icon/icon_1024.png"
    background_color: "#FAF7F5"
    theme_color: "#FF5722"
