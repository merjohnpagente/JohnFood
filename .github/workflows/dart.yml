name: Dart

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos > /tmp/analyze.log 2>&1 || true
          {
            echo "## flutter analyze"
            echo '```'
            cat /tmp/analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: |
          set -o pipefail
          flutter test > /tmp/test.log 2>&1 || true
          {
            echo "## flutter test"
            echo '```'
            cat /tmp/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-logs
          path: |
            /tmp/analyze.log
            /tmp/test.log

      - name: Enforce analyzer result
        run: |
          # Grep for real errors and fail only on those, mirroring
          # `flutter analyze` exit status without re-running it.
          if grep -qE "^\s*error •" /tmp/analyze.log; then
            cat /tmp/analyze.log
            exit 1
          fi