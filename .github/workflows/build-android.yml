name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders if missing
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --project-name john_foods --org com.merjdev.johnfoods
          fi

      - name: Remove template test stub
        run: rm -f test/widget_test.dart

      - name: Set Android app label
        run: |
          sed -i 's/android:label="[^"]*"/android:label="John Foods"/' android/app/src/main/AndroidManifest.xml
          git checkout -- web/index.html web/manifest.json || true

      - name: Enable core library desugaring
        run: |
          python3 - <<'EOF'
          import os
          g = "android/app/build.gradle"
          k = "android/app/build.gradle.kts"
          if os.path.exists(g):
              s = open(g).read()
              if "coreLibraryDesugaring" not in s:
                  s = s.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled = true", 1)
                  s = s.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring \x27com.android.tools:desugar_jdk_libs:2.1.4\x27", 1)
                  open(g, "w").write(s)
                  print("patched Groovy build.gradle")
          elif os.path.exists(k):
              s = open(k).read()
              if "coreLibraryDesugaring" not in s:
                  s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                  s = s.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring(\x27com.android.tools:desugar_jdk_libs:2.1.4\x27)", 1)
                  open(k, "w").write(s)
                  print("patched Kotlin build.gradle.kts")
          else:
              raise SystemExit("no android build file found")
          EOF


      - name: Create debug signing keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/johnfoods-debug.jks -alias johnfoods -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=JohnFoods, OU=Dev, O=MerjDev, L=CDO, ST=MO, C=PH"
          printf "storePassword=android\nkeyPassword=android\nkeyAlias=johnfoods\nstoreFile=/tmp/johnfoods-debug.jks\n" > android/key.properties

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          --dart-define=CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: john-foods-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JohnFoods Android APK
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          generate_release_notes: false
