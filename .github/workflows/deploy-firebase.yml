name: Deploy Firestore rules (free, Spark plan)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy \
            --only firestore \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive 2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            echo "### Firestore deploy log"
            echo '```'
            tail -60 /tmp/deploy.log
            echo '```'
            TITLE="Firestore deploy failed ${{ github.sha }}"
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
              gh issue create --title "$TITLE" \
                --body "$(printf '### Firestore deploy log\n\n```\n%s\n```\n' "$(tail -60 /tmp/deploy.log)")" || true
            exit "$rc"
          fi
