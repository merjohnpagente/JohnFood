name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap platform folders if missing
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --project-name john_foods --org com.merjdev.johnfoods
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
        continue-on-error: true
      - name: Fail on emoji
        run: |
          if grep -rP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{FE00}-\x{FE0F}]' lib assets test --include='*.dart' --include='*.md' -n; then
            echo 'Emoji found in source. Remove all emoji.'
            exit 1
          fi
          echo 'No emoji found.'
